name: Docs

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      # Install the SDK's deps so TypeDoc can resolve types (unadapter, zod)
      # from packages/messageweave/src when generating the API reference.
      - name: Install workspace
        run: pnpm install --frozen-lockfile

      # website/ is its own isolated pnpm root (see website/pnpm-workspace.yaml).
      - name: Install docs site
        run: pnpm install --frozen-lockfile
        working-directory: website

      - name: Validate and build docs site
        run: pnpm run check
        working-directory: website
